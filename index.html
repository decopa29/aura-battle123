<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA BATTLE - VERIFICATION & ARENA</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #08070c;
      color: #ffffff;
      font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
    }

    /* En-tête */
    .header { text-align: center; margin-bottom: 10px; }
    .title {
      font-size: 2.2rem;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #c084fc 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
      text-transform: uppercase;
    }
    .status-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 4px 14px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid #a855f7;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #e9d5ff;
    }

    /* === 1. SECTION VÉRIFICATION DE CAMÉRA (GRAND ÉCRAN) === */
    #verificationOverlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }
    .verify-camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
      margin-bottom: 12px;
    }
    .verify-instructions {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.85);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #a855f7;
      text-align: center;
      z-index: 20;
    }
    .verify-step-title {
      font-size: 0.9rem;
      color: #38bdf8;
      font-family: sans-serif;
      font-weight: bold;
      text-transform: uppercase;
    }
    .verify-step-desc {
      font-size: 0.8rem;
      color: #e4e4e7;
      font-family: sans-serif;
      margin-top: 4px;
    }

    /* === 2. SECTION BOUTON JOUER & COMPTEUR === */
    #lobbyOverlay {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-top: 20px;
    }
    .btn-play {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
      color: #fff;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
      transition: transform 0.1s;
    }
    .btn-play:active { transform: scale(0.98); }
    
    .connecting-timer {
      display: none;
      margin-top: 20px;
      text-align: center;
      background: #120e1a;
      border: 1px solid #a855f7;
      padding: 16px 24px;
      border-radius: 14px;
      width: 100%;
    }
    .timer-label { font-family: sans-serif; font-size: 0.85rem; color: #a1a1aa; }
    .timer-value { font-size: 2.5rem; color: #f0abfc; margin-top: 4px; }

    /* === 3. SECTION DUEL ARENE === */
    #arenaOverlay {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 800px;
    }
    .aura-dashboard {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 10px;
    }
    .aura-card {
      flex: 1;
      background: #120e1a;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .aura-card .label { font-family: sans-serif; font-size: 0.65rem; color: #a1a1aa; }
    .aura-card .value { font-size: 1.4rem; color: #f0abfc; }

    .arena-container {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .player-box {
      flex: 1;
      position: relative;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #a855f7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }
    .player-box.opponent {
      border-color: #ef4444;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }
    .player-label {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 0.7rem;
      font-weight: bold;
      z-index: 10;
    }
    .mog-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(168, 85, 247, 0.85);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 0.75rem;
      font-weight: bold;
      z-index: 10;
    }

    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .mirror { transform: scaleX(-1); }
  </style>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="header">
    <h1 class="title">AURA BATTLE</h1>
    <div id="status" class="status-badge">VÉRIFICATION REQUISE</div>
  </div>

  <!-- 1. VÉRIFICATION AVANT-JEU -->
  <div id="verificationOverlay">
    <div class="verify-camera-box">
      <div class="verify-instructions">
        <div id="verifyStepTitle" class="verify-step-title">ÉTAPE 1 / 4 : MONTRER TES MAINS</div>
        <div id="verifyStepDesc" class="verify-step-desc">Place tes mains devant l'écran pour calibrer la détection.</div>
      </div>
      <video id="verifyWebcam" class="mirror" autoplay playsinline muted></video>
      <canvas id="verifyCanvas" class="mirror"></canvas>
    </div>
  </div>

  <!-- 2. BOUTON JOUER ET COMPTEUR -->
  <div id="lobbyOverlay">
    <button id="playBtn" class="btn-play">JOUER</button>
    <div id="connectingTimer" class="connecting-timer">
      <div class="timer-label">RECHERCHE D'ADVERSAIRE EN COURS...</div>
      <div id="timerValue" class="timer-value">0.0s</div>
    </div>
  </div>

  <!-- 3. ARENE DE DUEL EN DIRECT -->
  <div id="arenaOverlay">
    <div class="aura-dashboard">
      <div class="aura-card">
        <div class="label">TON AURA</div>
        <div id="myAuraVal" class="value">0</div>
      </div>
      <div class="aura-card">
        <div class="label">MOG SCORE</div>
        <div id="myMogVal" class="value">0%</div>
      </div>
      <div class="aura-card">
        <div class="label">AURA ADVERSAIRE</div>
        <div id="oppAuraVal" class="value">0</div>
      </div>
    </div>

    <div class="arena-container">
      <!-- TOI -->
      <div class="player-box">
        <div class="player-label" style="color: #c084fc;">TOI</div>
        <div id="myMogTag" class="mog-tag">MOG : 0%</div>
        <video id="arenaWebcam" class="mirror" autoplay playsinline muted></video>
        <canvas id="arenaCanvas" class="mirror"></canvas>
      </div>

      <!-- ADVERSAIRE -->
      <div class="player-box opponent">
        <div class="player-label" style="color: #f87171;">ADVERSAIRE</div>
        <div id="oppMogTag" class="mog-tag">MOG : 0%</div>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const verificationOverlay = document.getElementById('verificationOverlay');
    const lobbyOverlay = document.getElementById('lobbyOverlay');
    const arenaOverlay = document.getElementById('arenaOverlay');

    const verifyStepTitle = document.getElementById('verifyStepTitle');
    const verifyStepDesc = document.getElementById('verifyStepDesc');
    const verifyWebcam = document.getElementById('verifyWebcam');
    const verifyCanvas = document.getElementById('verifyCanvas');
    const verifyCtx = verifyCanvas.getContext('2d');

    const playBtn = document.getElementById('playBtn');
    const connectingTimer = document.getElementById('connectingTimer');
    const timerValue = document.getElementById('timerValue');

    const arenaWebcam = document.getElementById('arenaWebcam');
    const arenaCanvas = document.getElementById('arenaCanvas');
    const arenaCtx = arenaCanvas.getContext('2d');
    const remoteVideo = document.getElementById('remoteVideo');

    const myAuraVal = document.getElementById('myAuraVal');
    const myMogVal = document.getElementById('myMogVal');
    const oppAuraVal = document.getElementById('oppAuraVal');
    const myMogTag = document.getElementById('myMogTag');
    const oppMogTag = document.getElementById('oppMogTag');

    let currentStep = 1; // 1: Mains, 2: Gauche, 3: Droite, 4: Mog Check, 5: Prêt
    let searchTimer = null;
    let secondsElapsed = 0;
    let localStream = null;
    let totalAura = 0;
    let mogScore = 0;
    let roomId = null;
    let peerConnection = null;

    const socket = io();

    // Models MediaPipe
    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });

    const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });

    // Traitement de la vérification
    hands.onResults((results) => {
      const activeCanvas = currentStep < 5 ? verifyCanvas : arenaCanvas;
      const activeCtx = currentStep < 5 ? verifyCtx : arenaCtx;
      const activeVideo = currentStep < 5 ? verifyWebcam : arenaWebcam;

      activeCanvas.width = activeVideo.videoWidth;
      activeCanvas.height = activeVideo.videoHeight;
      activeCtx.save();
      activeCtx.clearRect(0, 0, activeCanvas.width, activeCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        if (currentStep === 1) {
          nextVerifyStep(2, "ÉTAPE 2 / 4 : TOURNER LA TÊTE À GAUCHE", "Tourne doucement la tête vers la gauche.");
        } else if (currentStep === 5) {
          totalAura += 2;
          myAuraVal.textContent = totalAura;
          if (roomId) socket.emit('updateAura', { room: roomId, aura: totalAura });
        }

        for (const landmarks of results.multiHandLandmarks) {
          for (const pt of landmarks) {
            activeCtx.beginPath();
            activeCtx.arc(pt.x * activeCanvas.width, pt.y * activeCanvas.height, 5, 0, 2 * Math.PI);
            activeCtx.fillStyle = '#a855f7';
            activeCtx.fill();
          }
        }
      }
      activeCtx.restore();
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        const leftEar = landmarks[234];
        const rightEar = landmarks[454];

        const headTurnRatio = (nose.x - leftEar.x) / (rightEar.x - leftEar.x);

        if (currentStep === 2 && headTurnRatio < 0.35) {
          nextVerifyStep(3, "ÉTAPE 3 / 4 : TOURNER LA TÊTE À DROITE", "Tourne doucement la tête vers la droite.");
        } else if (currentStep === 3 && headTurnRatio > 0.65) {
          nextVerifyStep(4, "ÉTAPE 4 / 4 : MOG CHECK", "Fixe l'écran et contracte la mâchoire !");
        } else if (currentStep === 4) {
          const chin = landmarks[152];
          mogScore = Math.min(100, Math.floor(Math.abs(chin.y - nose.y) * 350));

          if (mogScore > 40) {
            currentStep = 5;
            verificationOverlay.style.display = 'none';
            lobbyOverlay.style.display = 'flex';
            statusDiv.textContent = 'VÉRIFICATION RÉUSSIE !';
            statusDiv.style.borderColor = '#22c55e';
          }
        } else if (currentStep === 5) {
          const chin = landmarks[152];
          mogScore = Math.min(100, Math.floor(Math.abs(chin.y - nose.y) * 350));
          myMogVal.textContent = mogScore + '%';
          myMogTag.textContent = 'MOG : ' + mogScore + '%';
        }
      }
    });

    function nextVerifyStep(step, title, desc) {
      currentStep = step;
      verifyStepTitle.textContent = title;
      verifyStepDesc.textContent = desc;
    }

    // Initialiser la caméra globale
    async function initVerificationCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        verifyWebcam.srcObject = localStream;
        arenaWebcam.srcObject = localStream;

        const camera = new Camera(verifyWebcam, {
          onFrame: async () => {
            const vid = currentStep < 5 ? verifyWebcam : arenaWebcam;
            await hands.send({ image: vid });
            await faceMesh.send({ image: vid });
          },
          width: 480, height: 640
        });
        camera.start();

      } catch (err) {
        statusDiv.textContent = 'ACCÈS CAMÉRA REFUSÉ';
      }
    }

    // 2. Clic sur le bouton JOUER -> Lancement du compteur
    playBtn.addEventListener('click', () => {
      playBtn.style.display = 'none';
      connectingTimer.style.display = 'block';
      statusDiv.textContent = 'CONNEXION AU SERVEUR...';

      secondsElapsed = 0;
      searchTimer = setInterval(() => {
        secondsElapsed += 0.1;
        timerValue.textContent = secondsElapsed.toFixed(1) + 's';
      }, 100);

      socket.emit('findMatch');
    });

    // 3. Match trouvé -> Bascule sur l'arène de duel
    socket.on('matchFound', (data) => {
      clearInterval(searchTimer);
      roomId = data.roomId;

      lobbyOverlay.style.display = 'none';
      arenaOverlay.style.display = 'flex';
      statusDiv.textContent = 'ADVERSAIRE CONNECTÉ 🔥';
      statusDiv.style.borderColor = '#ef4444';

      createPeerConnection();

      if (data.role === 'player1') {
        peerConnection.createOffer().then(offer => {
          peerConnection.setLocalDescription(offer);
          socket.emit('signal', { room: roomId, signal: { offer: offer } });
        });
      }
    });

    // WebRTC & Signalisation
    function createPeerConnection() {
      peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19020' }] });
      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }
      peerConnection.ontrack = (e) => { remoteVideo.srcObject = e.streams[0]; };
      peerConnection.onicecandidate = (e) => {
        if (e.candidate) socket.emit('signal', { room: roomId, signal: { candidate: e.candidate } });
      };
    }

    socket.on('signal', async (data) => {
      if (!peerConnection) createPeerConnection();
      if (data.signal.offer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('signal', { room: roomId, signal: { answer: answer } });
      } else if (data.signal.answer) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.answer));
      } else if (data.signal.candidate) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
      }
    });

    socket.on('opponentAura', (data) => {
      oppAuraVal.textContent = data.aura;
    });

    initVerificationCamera();
  </script>
</body>
</html>
