<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA BATTLE</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d11;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #a855f7;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 12px;
      text-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
    }
    #status {
      background: #18181b;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
    }
    .game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .controls {
      margin-top: 20px;
      width: 100%;
      max-width: 420px;
    }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #a855f7;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }
    button:active { background: #9333ea; }
  </style>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>AURA BATTLE</h1>
  <div id="status">Connexion au serveur...</div>

  <div class="game-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="controls">
    <button id="findMatchBtn">Trouver un Adversaire</button>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const findMatchBtn = document.getElementById('findMatchBtn');
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    const socket = io();

    socket.on('connect', () => {
      statusDiv.textContent = 'Connexion établie - En attente';
    });

    // Demande des permissions Caméra + Microphone
    async function initMedia() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, 
          audio: true 
        });
        videoElement.srcObject = stream;
        
        // Initialiser MediaPipe
        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });
        hands.onResults((results) => {
          canvasElement.width = videoElement.videoWidth;
          canvasElement.height = videoElement.videoHeight;
          canvasCtx.save();
          canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
          if (results.multiHandLandmarks) {
            for (const landmarks of results.multiHandLandmarks) {
              for (const pt of landmarks) {
                canvasCtx.beginPath();
                canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 5, 0, 2 * Math.PI);
                canvasCtx.fillStyle = '#a855f7';
                canvasCtx.fill();
              }
            }
          }
          canvasCtx.restore();
        });

        const camera = new Camera(videoElement, {
          onFrame: async () => { await hands.send({ image: videoElement }); },
          width: 640, height: 480
        });
        camera.start();

      } catch (err) {
        statusDiv.textContent = 'Accès caméra/micro refusé !';
      }
    }

    findMatchBtn.addEventListener('click', () => {
      statusDiv.textContent = 'Recherche d\'un adversaire...';
      socket.emit('findMatch');
    });

    initMedia();
  </script>
</body>
</html>
