<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Battle - Duel en ligne</title>
  
  <!-- CSS Styles -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121214;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #a855f7;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #status {
      background: #1f1f23;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 15px;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
    }
    .game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Effet miroir */
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #a855f7;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active {
      background: #9333ea;
    }
    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }
  </style>

  <!-- Bibliothèques : Socket.io & MediaPipe Hands -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>Aura Battle</h1>
  <div id="status">Connexion au serveur...</div>

  <div class="game-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <div class="controls">
    <button id="findMatchBtn">Trouver un Adversaire</button>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const findMatchBtn = document.getElementById('findMatchBtn');
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    let roomId = null;

    // 1. Connexion à Socket.io
    const socket = io();

    socket.on('connect', () => {
      statusDiv.textContent = 'En ligne - Prêt à chercher une partie';
      statusDiv.style.borderColor = '#22c55e';
    });

    socket.on('disconnect', () => {
      statusDiv.textContent = 'Déconnecté du serveur';
      statusDiv.style.borderColor = '#ef4444';
    });

    // Recherche d'adversaire
    findMatchBtn.addEventListener('click', () => {
      statusDiv.textContent = 'Recherche d\'un adversaire...';
      findMatchBtn.disabled = true;
      socket.emit('findMatch');
    });

    socket.on('matchFound', (data) => {
      roomId = data.roomId;
      statusDiv.textContent = 'Match trouvé ! Combat en cours...';
      statusDiv.style.borderColor = '#a855f7';
    });

    // 2. Configuration de MediaPipe Hands pour la webcam
    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          // Dessiner les points de la main
          for (const point of landmarks) {
            const x = point.x * canvasElement.width;
            const y = point.y * canvasElement.height;
            
            canvasCtx.beginPath();
            canvasCtx.arc(x, y, 6, 0, 2 * Math.PI);
            canvasCtx.fillStyle = '#a855f7';
            canvasCtx.fill();
          }
        }
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `
