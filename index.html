<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA BATTLE - VERIFICATION & MOG ARENA</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #08070c;
      color: #ffffff;
      font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    .header { text-align: center; margin-bottom: 8px; }
    .title {
      font-size: 2rem;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #c084fc 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
      text-transform: uppercase;
    }
    .status-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 4px 14px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid #a855f7;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #e9d5ff;
    }

    /* Panneau de Calibration / Étape */
    .calibration-box {
      width: 100%;
      max-width: 800px;
      background: #120e1a;
      border: 2px solid #a855f7;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      text-align: center;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
    }
    .step-title {
      font-family: sans-serif;
      font-size: 0.95rem;
      font-weight: bold;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .step-instruction {
      font-family: sans-serif;
      font-size: 0.85rem;
      color: #a1a1aa;
      margin-top: 4px;
    }

    /* Grille de Duel */
    .arena-container {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 10px;
    }

    .player-box {
      flex: 1;
      position: relative;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #a855f7;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .player-box.opponent {
      border-color: #ef4444;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    .player-label {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 0.7rem;
      font-weight: bold;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .mog-score-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(168, 85, 247, 0.8);
      padding: 4px 10px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
      z-index: 10;
    }

    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    #webcam { transform: scaleX(-1); }

    .aura-dashboard {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 10px;
    }
    .aura-card {
      flex: 1;
      background: #120e1a;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .aura-card .label { font-family: sans-serif; font-size: 0.65rem; color: #a1a1aa; }
    .aura-card .value { font-size: 1.4rem; color: #f0abfc; }

    .controls { width: 100%; max-width: 800px; }
    .btn-battle {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }
    .btn-battle:disabled {
      background: #3f3f46;
      box-shadow: none;
      cursor: not-allowed;
      color: #71717a;
    }
  </style>

  <script src="/socket.io/socket.io.js"></script>
  <!-- MediaPipe Hands & Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="header">
    <h1 class="title">AURA BATTLE</h1>
    <div id="status" class="status-badge">CALIBRATION DE LA CAMÉRA</div>
  </div>

  <div class="calibration-box">
    <div id="stepTitle" class="step-title">ÉTAPE 1 / 4 : DÉTECTION DES MAINS</div>
    <div id="stepInstruction" class="step-instruction">Montre tes deux mains devant l'écran pour les repérer.</div>
  </div>

  <div class="aura-dashboard">
    <div class="aura-card">
      <div class="label">TON AURA</div>
      <div id="myAuraVal" class="value">0</div>
    </div>
    <div class="aura-card">
      <div class="label">TON SCORE MOG</div>
      <div id="myMogVal" class="value">0%</div>
    </div>
    <div class="aura-card">
      <div class="label">AURA ADVERSAIRE</div>
      <div id="oppAuraVal" class="value">0</div>
    </div>
  </div>

  <div class="arena-container">
    <div class="player-box">
      <div class="player-label" style="color: #c084fc;">TOI</div>
      <div id="myMogTag" class="mog-score-tag">MOG : --</div>
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="output_canvas"></canvas>
    </div>

    <div class="player-box opponent">
      <div class="player-label" style="color: #f87171;">ADVERSAIRE</div>
      <div id="oppMogTag" class="mog-score-tag">MOG : --</div>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <div class="controls">
    <button id="findMatchBtn" class="btn-battle" disabled>VERIFICATION EN COURS...</button>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const stepTitle = document.getElementById('stepTitle');
    const stepInstruction = document.getElementById('stepInstruction');
    const findMatchBtn = document.getElementById('findMatchBtn');

    const videoElement = document.getElementById('webcam');
    const remoteVideo = document.getElementById('remoteVideo');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    const myAuraEl = document.getElementById('myAuraVal');
    const myMogEl = document.getElementById('myMogVal');
    const oppAuraEl = document.getElementById('oppAuraVal');

    const myMogTag = document.getElementById('myMogTag');
    const oppMogTag = document.getElementById('oppMogTag');

    let currentStep = 1; // 1: Mains, 2: Tête Gauche, 3: Tête Droite, 4: Mog Check, 5: Terminé
    let totalAura = 0;
    let mogScore = 0;
    let localStream = null;
    let roomId = null;

    const socket = io();

    // 1. Initialisation des modèles MediaPipe (Hands + FaceMesh)
    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1 });

    const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });

    hands.onResults((results) => {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        if (currentStep === 1) {
          nextStep(2, "ÉTAPE 2 / 4 : TOURNER LA TÊTE À GAUCHE", "Tourne doucement ton visage vers la gauche.");
        }
        for (const landmarks of results.multiHandLandmarks) {
          for (const pt of landmarks) {
            canvasCtx.beginPath();
            canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 4, 0, 2 * Math.PI);
            canvasCtx.fillStyle = '#a855f7';
            canvasCtx.fill();
          }
        }
      }
      canvasCtx.restore();
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        const nose = landmarks[1];
        const leftEar = landmarks[234];
        const rightEar = landmarks[454];

        // Calcul de la rotation horizontale de la tête
        const headTurnRatio = (nose.x - leftEar.x) / (rightEar.x - leftEar.x);

        if (currentStep === 2 && headTurnRatio < 0.35) {
          nextStep(3, "ÉTAPE 3 / 4 : TOURNER LA TÊTE À DROITE", "Tourne doucement ton visage vers la droite.");
        } else if (currentStep === 3 && headTurnRatio > 0.65) {
          nextStep(4, "ÉTAPE 4 / 4 : MOG CHECK (JAWLINE)", "Fixe l'écran, contracte la mâchoire et Mog !");
        } else if (currentStep === 4) {
          // Calcul du Mog / Jawline Score basique basé sur la hauteur du menton
          const chin = landmarks[152];
          mogScore = Math.min(100, Math.floor(Math.abs(chin.y - nose.y) * 350));
          myMogEl.textContent = mogScore + '%';
          myMogTag.textContent = 'MOG : ' + mogScore + '%';

          if (mogScore > 50) {
            currentStep = 5;
            stepTitle.textContent = "CALIBRATION REUSSIE !";
            stepInstruction.textContent = "Tous les systèmes sont prêts. Tu peux lancer le duel !";
            findMatchBtn.disabled = false;
            findMatchBtn.textContent = "LANCER LE DUEL";
            statusDiv.textContent = "PRÊT AU COMBAT";
          }
        }
      }
    });

    function nextStep(step, title, instruction) {
      currentStep = step;
      stepTitle.textContent = title;
      stepInstruction.textContent = instruction;
    }

    // Camera loop
    async function initCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        videoElement.srcObject = localStream;

        const camera = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
            await faceMesh.send({ image: videoElement });
          },
          width: 480, height: 640
        });
        camera.start();
      } catch (err) {
        statusDiv.textContent = 'ACCÈS CAMÉRA REFUSÉ';
      }
    }

    findMatchBtn.addEventListener('click', () => {
      statusDiv.textContent = 'RECHERCHE D\'UN ADVERSAIRE...';
      socket.emit('findMatch');
    });

    initCamera();
  </script>
</body>
</html>
